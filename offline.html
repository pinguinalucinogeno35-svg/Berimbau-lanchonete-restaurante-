<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sem conexão | Berimbau Gourmet</title>
  <link rel="stylesheet" href="assets/tokens.css">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
      background: var(--bg-creme); color: var(--cafe); font: 400 16px/1.5 var(--font-texto); text-align: center; }
    img { width: 200px; }
    h1 { font: 700 2rem/1.1 var(--font-titulo); margin: 24px 0 8px; }
    p { color: var(--sepia-claro); max-width: 32ch; margin: 0 auto 20px; }
  </style>
</head>
<body>
  <main>
    <img src="assets/marca/logo-berimbau-completo.svg" alt="Berimbau Gourmet">
    <h1>Você está sem internet</h1>
    <p>Assim que a conexão voltar, o cardápio e os pedidos funcionam normalmente.</p>
    <button class="botao" onclick="location.reload()">Tentar de novo</button>
  </main>
</body>
</html>
